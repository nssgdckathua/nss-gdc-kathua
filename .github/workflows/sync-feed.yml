name: Sync NSS Feed

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch NSS feed safely
        run: |
          set -e

          TEMP_FILE="$(mktemp)"

          echo "Fetching NSS feed..."

          HTTP_CODE=$(curl -L -sS \
            -A "Mozilla/5.0" \
            -w "%{http_code}" \
            -o "$TEMP_FILE" \
            "https://script.google.com/macros/s/AKfycbxEFciYSaJO0F8jtnPuHL2AHQkCIKXaEFI54RXupe-1hic8nlJlDVfxz1-mU-A_qUWD/exec")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Apps Script returned HTTP $HTTP_CODE"
            echo "Response received:"
            head -c 1000 "$TEMP_FILE"
            exit 1
          fi

          echo "Validating JSON..."

          if ! jq empty "$TEMP_FILE"; then
            echo "ERROR: Response is not valid JSON."
            echo "Response received:"
            head -c 1000 "$TEMP_FILE"
            exit 1
          fi

          echo "JSON is valid."

          echo "Checking Volunteers field..."

          jq '{
            VolunteersEnabled: .VolunteersEnabled,
            VolunteerCount: (.Volunteers | length)
          }' "$TEMP_FILE"

          mv "$TEMP_FILE" data/feed.json

          echo "Feed updated successfully."

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/feed.json

          if git diff --cached --quiet; then
            echo "No changes to feed."
          else
            git commit -m "Update NSS feed"
            git push
          fi
